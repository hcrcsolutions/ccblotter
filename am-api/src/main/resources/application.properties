# Server Configuration
server.port=8080
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev,testDataAllowed}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:osccstate}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=5000ms

# Kafka (optional)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=am-api-infrastructure
spring.kafka.consumer.auto-offset-reset=earliest

# Node Health Settings
app.node.heartbeat-interval-seconds=30
app.node.unhealthy-threshold-seconds=60
app.node.removal-threshold-seconds=300
app.node.watchdog-interval-seconds=15
app.node.auto-remove-enabled=false

# Mock Data (dev only)
app.mock-data.enabled=${MOCK_DATA_ENABLED:false}

# WebSocket Configuration
spring.websocket.message-broker.stomp.endpoint=/ws
spring.websocket.message-broker.stomp.broker-prefix=/topic
spring.websocket.message-broker.stomp.application-prefix=/app

# Actuator for health checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.redis.enabled=true
management.health.db.enabled=true

# Recordings
app.recordings.storage=${RECORDINGS_STORAGE:local}
app.recordings.storage-dir=${RECORDINGS_DIR:./recordings}
app.recordings.max-file-size-bytes=52428800
app.recordings.base-url=${RECORDINGS_BASE_URL:}
app.recordings.webdav-url=${RECORDINGS_WEBDAV_URL:}
app.recordings.webdav-username=${RECORDINGS_WEBDAV_USERNAME:}
app.recordings.webdav-password=${RECORDINGS_WEBDAV_PASSWORD:}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# TTS (Amazon Polly)
tts.default-voice-id=${TTS_DEFAULT_VOICE:Joanna}
tts.engine=${TTS_ENGINE:neural}
tts.sample-rate=8000
tts.cache-enabled=true
tts.cache-max-entries=100
tts.aws-region=${AWS_REGION:us-east-1}

# Logging
logging.level.com.fmr.ec3.oscc.state=DEBUG
logging.level.org.springframework.web.socket=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
