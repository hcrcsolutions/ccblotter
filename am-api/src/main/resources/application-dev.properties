# Development Profile

# Enable mock data generator
app.mock-data.enabled=true

# WebDAV recording storage (docker compose webdav service)
app.recordings.storage=webdav
app.recordings.webdav-url=https://localhost:8888/recordings/
app.recordings.webdav-username=webdav
app.recordings.webdav-password=webdav
app.recordings.base-url=https://localhost:8888/recordings/
app.recordings.webdav-insecure-ssl=true

# Development logging
logging.level.com.example.agentmonitor=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
