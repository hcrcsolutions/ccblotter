server:
  port: 8084

# AWS authentication uses the default credential provider chain:
#   1. Environment variables: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   2. Java system properties: aws.accessKeyId, aws.secretAccessKey
#   3. Web identity token (EKS/IRSA)
#   4. Shared credentials file: ~/.aws/credentials (profile: default)
#   5. EC2/ECS instance profile (IAM role)
tts:
  default-voice-id: Joanna
  engine: neural
  sample-rate: 8000
  cache-enabled: true
  cache-max-entries: 100
  aws-region: us-east-1

logging:
  level:
    com.fmr.ec3.oscc.ttsconsumer: DEBUG
    software.amazon.awssdk: WARN
