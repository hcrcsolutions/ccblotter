server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:osccstate}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 2
      connection-timeout: 5000
      read-only: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ivr-server
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual
  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    com.fmr.ec3.oscc.ivr.server: DEBUG
