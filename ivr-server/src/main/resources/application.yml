server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ivr-server-${random.uuid}
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual
  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    com.fmr.ec3.oscc.ivr.server: DEBUG
